<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure Extractor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .topbar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .topbar h1 {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .pane-toggles {
            display: flex;
            gap: 4px;
            margin-left: 24px;
        }

        .pane-toggle {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            color: #666;
        }

        .pane-toggle:hover {
            background: #f5f5f5;
        }

        .pane-toggle.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }

        .topbar-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 14px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover { background: #f5f5f5; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }

        .btn-primary:hover { background: #1557b0; }

        /* Main layout */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Panes */
        .pane {
            display: none;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            background: #fff;
            overflow: hidden;
        }

        .pane.visible {
            display: flex;
        }

        .pane:last-child {
            border-right: none;
        }

        .pane-header {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #fafafa;
            flex-shrink: 0;
        }

        .pane-content {
            flex: 1;
            overflow: auto;
        }

        /* Browser pane */
        #browserPane {
            width: 280px;
            flex-shrink: 0;
        }

        #browserPane.visible ~ .pane.visible {
            flex: 1;
        }

        .browser-section {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .browser-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .browser-btn {
            width: 100%;
            padding: 10px 12px;
            background: #fafafa;
            border: 1px dashed #ddd;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            color: #666;
            transition: all 0.15s;
        }

        .browser-btn:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .project-name {
            padding: 10px 12px;
            background: #e8f0fe;
            border-radius: 6px;
            font-size: 13px;
            color: #1a73e8;
            font-weight: 500;
        }

        .article-list {
            margin-top: 8px;
        }

        .article-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 2px;
            transition: background 0.15s;
        }

        .article-item:hover {
            background: #f5f5f5;
        }

        .article-item.active {
            background: #e8f0fe;
            color: #1a73e8;
        }

        .article-item-name {
            font-weight: 500;
            margin-bottom: 2px;
        }

        .article-item-meta {
            font-size: 11px;
            color: #999;
        }

        .article-item.active .article-item-meta {
            color: #5a9cf8;
        }

        .no-items {
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        /* Article pane */
        #articlePane {
            flex: 1;
            min-width: 400px;
        }

        .article-scroll {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-wrapper {
            position: relative;
            margin-bottom: 16px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .page-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            z-index: 10;
        }

        .page-container {
            position: relative;
            line-height: 0;
        }

        .page-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .annotation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .annotation-box {
            position: absolute;
            border: 2px solid #1a73e8;
            background: rgba(26, 115, 232, 0.08);
            cursor: pointer;
        }

        .annotation-box.subfigure {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
        }

        .annotation-label {
            position: absolute;
            top: -20px;
            left: -2px;
            background: #1a73e8;
            color: #fff;
            padding: 2px 8px;
            font-size: 10px;
            border-radius: 2px 2px 0 0;
            white-space: nowrap;
        }

        .annotation-box.subfigure .annotation-label {
            background: #f59e0b;
        }

        .annotation-delete {
            position: absolute;
            top: -20px;
            right: -2px;
            background: #dc2626;
            color: #fff;
            border: none;
            width: 18px;
            height: 18px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 0 2px 0 0;
            line-height: 1;
            z-index: 100;
            pointer-events: auto;
        }
        
        .annotation-delete:hover {
            background: #b91c1c;
        }

        .drawing-box {
            position: absolute;
            border: 2px dashed #1a73e8;
            background: rgba(26, 115, 232, 0.1);
            pointer-events: none;
        }

        /* Figures pane */
        #figuresPane {
            flex: 1;
            min-width: 400px;
        }

        .figures-scroll {
            padding: 20px;
        }

        .figure-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .figure-header {
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fafafa;
        }

        .figure-label-input {
            font-size: 13px;
            font-weight: 500;
            border: 1px solid transparent;
            padding: 4px 8px;
            border-radius: 4px;
            background: transparent;
            min-width: 100px;
        }

        .figure-label-input:hover {
            background: #fff;
            border-color: #ddd;
        }

        .figure-label-input:focus {
            border-color: #1a73e8;
            outline: none;
            background: #fff;
        }

        .figure-content {
            padding: 14px;
            display: flex;
            gap: 16px;
        }

        .figure-image-container {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .figure-image-container img {
            max-width: 100%;
            height: auto;
            display: block;
            border: 1px solid #eee;
        }

        .subfigures-panel {
            width: 180px;
            flex-shrink: 0;
        }

        .subfigures-panel h4 {
            font-size: 10px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subfigure-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .subfigure-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            background: #fafafa;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .subfigure-item img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 2px;
            border: 1px solid #ddd;
        }

        .subfigure-item input {
            flex: 1;
            font-size: 11px;
            border: 1px solid #ddd;
            padding: 4px 6px;
            border-radius: 3px;
            min-width: 0;
        }

        .subfigure-item button {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 2px;
            font-size: 14px;
        }

        .subfigure-item button:hover {
            color: #dc2626;
        }

        .subfigure-hint {
            font-size: 10px;
            color: #bbb;
            margin-top: 10px;
            text-align: center;
        }

        /* Empty states */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading.visible {
            display: flex;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e5e5e5;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        input[type="file"] { display: none; }

        /* PDF Modal */
        #pdfModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        #pdfModal.visible { display: flex; }
        .pdf-modal-box {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            min-width: 320px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .pdf-modal-box h3 { font-size: 15px; margin-bottom: 16px; color: #333; }
        .pdf-modal-box label { font-size: 13px; color: #555; display: block; margin-bottom: 8px; }
        .pdf-modal-box select { font-size: 13px; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 16px; }
        .pdf-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        #pdfProgress { font-size: 12px; color: #666; margin-bottom: 12px; min-height: 18px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="topbar">
        <h1>Figure Extractor</h1>
        <div class="pane-toggles">
            <button class="pane-toggle active" data-pane="browser">Browser</button>
            <button class="pane-toggle active" data-pane="article">Article</button>
            <button class="pane-toggle active" data-pane="figures">Figures</button>
        </div>
        <div class="topbar-actions">
            <button class="btn" id="resetBtn" disabled title="Reset to Docling annotations (discard manual edits)">Reset</button>
            <button class="btn btn-primary" id="exportBtn" disabled>Export</button>
        </div>
    </div>

    <div class="main">
        <!-- Browser Pane -->
        <div class="pane visible" id="browserPane">
            <div class="pane-header">Browser</div>
            <div class="pane-content">
                <div class="browser-section">
                    <div class="browser-section-title">Project Folder</div>
                    <div id="projectDisplay">
                        <button class="browser-btn" id="selectProjectBtn">Select Project Folder</button>
                    </div>
                    <input type="file" id="projectInput" webkitdirectory multiple>
                </div>
                <div class="browser-section" id="pdfSection">
                    <div class="browser-section-title">PDF</div>
                    <button class="browser-btn" id="loadPdfBtn">Load PDF</button>
                    <input type="file" id="pdfInput" accept=".pdf">
                </div>
                <div class="browser-section" id="articlesSection" style="display:none;">
                    <div class="browser-section-title">Articles</div>
                    <div class="article-list" id="articleList"></div>
                </div>
            </div>
        </div>

        <!-- Article Pane -->
        <div class="pane visible" id="articlePane">
            <div class="pane-header">Article <span id="articleTitle"></span></div>
            <div class="pane-content">
                <div class="empty-state" id="articleEmpty">
                    <div class="empty-state-icon">📄</div>
                    <p>Select an article from the browser</p>
                </div>
                <div class="article-scroll" id="articleScroll" style="display:none;"></div>
            </div>
        </div>

        <!-- Figures Pane -->
        <div class="pane visible" id="figuresPane">
            <div class="pane-header">Annotated Images <span id="figureCount"></span></div>
            <div class="pane-content">
                <div class="empty-state" id="figuresEmpty">
                    <div class="empty-state-icon">🖼</div>
                    <p>Draw rectangles around figures in the Article pane</p>
                </div>
                <div class="figures-scroll" id="figuresScroll" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div id="pdfModal">
        <div class="pdf-modal-box">
            <h3>Load PDF</h3>
            <label for="pdfDpi">Render DPI</label>
            <select id="pdfDpi">
                <option value="150">150 DPI (faster)</option>
                <option value="300" selected>300 DPI (higher quality)</option>
            </select>
            <div id="pdfProgress"></div>
            <div class="pdf-modal-actions">
                <button class="btn" id="cancelPdfBtn">Cancel</button>
                <button class="btn btn-primary" id="processPdfBtn">Process</button>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

<script>
const state = {
    projectName: null,
    projectFiles: [],
    articles: [],
    currentArticle: null,
    pages: [],
    figures: [],
    nextFigureNum: 1,
    isDrawing: false,
    drawStart: null,
    history: [],
    historyIndex: -1
};

// Init
document.addEventListener('DOMContentLoaded', () => {
    // Pane toggles
    document.querySelectorAll('.pane-toggle').forEach(btn => {
        btn.onclick = () => {
            btn.classList.toggle('active');
            const pane = document.getElementById(btn.dataset.pane + 'Pane');
            pane.classList.toggle('visible', btn.classList.contains('active'));
        };
    });

    document.getElementById('selectProjectBtn').onclick = () => {
        document.getElementById('projectInput').click();
    };

    document.getElementById('projectInput').onchange = handleProjectSelect;
    document.getElementById('exportBtn').onclick = exportAll;
    document.getElementById('resetBtn').onclick = resetToDocling;

    // PDF loading
    document.getElementById('loadPdfBtn').onclick = () => document.getElementById('pdfInput').click();
    document.getElementById('pdfInput').onchange = handlePdfSelect;
    document.getElementById('processPdfBtn').onclick = processPdf;
    document.getElementById('cancelPdfBtn').onclick = () => {
        document.getElementById('pdfModal').classList.remove('visible');
        document.getElementById('pdfProgress').textContent = '';
        document.getElementById('pdfInput').value = '';
    };

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    });
});

// Project selection
function handleProjectSelect(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    state.projectFiles = files;

    // Get project name from root folder
    const rootPath = files[0].webkitRelativePath.split('/')[0];
    state.projectName = rootPath;

    // Find article subdirectories (folders with numbered PNGs and annotations.json)
    const dirs = new Map();
    const annotationFiles = new Map();
    files.forEach(file => {
        const parts = file.webkitRelativePath.split('/');
        if (parts.length >= 3) {
            const articleName = parts[1];
            if (/^\d+\.png$/i.test(file.name)) {
                if (!dirs.has(articleName)) dirs.set(articleName, []);
                dirs.get(articleName).push(file);
            }
            // Also track annotations.json files
            if (file.name === 'annotations.json') {
                annotationFiles.set(articleName, file);
            }
        }
    });

    state.articles = [];
    dirs.forEach((files, name) => {
        state.articles.push({
            name,
            files: files.sort((a, b) => parseInt(a.name) - parseInt(b.name)),
            pageCount: files.length,
            annotationsFile: annotationFiles.get(name) || null
        });
    });
    state.articles.sort((a, b) => a.name.localeCompare(b.name));

    // Update UI
    document.getElementById('projectDisplay').innerHTML = `
        <div class="project-name">${state.projectName}</div>
        <button class="browser-btn" style="margin-top:8px;" onclick="document.getElementById('projectInput').click()">Change</button>
    `;

    renderArticleList();
    document.getElementById('articlesSection').style.display = 'block';
}

// ========== History (Undo/Redo) ==========
function pushHistory() {
    // Trim any future states if we branched
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push({
        figures: JSON.parse(JSON.stringify(state.figures)),
        nextFigureNum: state.nextFigureNum
    });
    if (state.history.length > 50) state.history.shift();
    state.historyIndex = state.history.length - 1;
}

function undo() {
    if (state.historyIndex <= 0) return;
    state.historyIndex--;
    const snap = state.history[state.historyIndex];
    state.figures = JSON.parse(JSON.stringify(snap.figures));
    state.nextFigureNum = snap.nextFigureNum;
    saveAnnotations();
    renderAnnotations();
    renderFiguresPane();
}

function redo() {
    if (state.historyIndex >= state.history.length - 1) return;
    state.historyIndex++;
    const snap = state.history[state.historyIndex];
    state.figures = JSON.parse(JSON.stringify(snap.figures));
    state.nextFigureNum = snap.nextFigureNum;
    saveAnnotations();
    renderAnnotations();
    renderFiguresPane();
}

// ========== PDF Loading ==========
let _pendingPdfFile = null;

function handlePdfSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    _pendingPdfFile = file;
    document.getElementById('pdfProgress').textContent = '';
    document.getElementById('pdfModal').classList.add('visible');
}

async function processPdf() {
    if (!_pendingPdfFile) return;
    const dpi = parseInt(document.getElementById('pdfDpi').value) || 300;
    const scale = dpi / 72;
    const progressEl = document.getElementById('pdfProgress');
    progressEl.textContent = 'Loading PDF...';
    document.getElementById('processPdfBtn').disabled = true;

    try {
        if (!window.pdfjsLib) throw new Error('PDF.js not loaded');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const arrayBuffer = await _pendingPdfFile.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const numPages = pdf.numPages;
        const pdfPages = [];

        for (let i = 1; i <= numPages; i++) {
            progressEl.textContent = `Rendering page ${i} / ${numPages}...`;
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            pdfPages.push(canvas.toDataURL('image/png'));
        }

        // Build a virtual article
        const articleName = _pendingPdfFile.name.replace(/\.pdf$/i, '');
        const virtualArticle = {
            name: articleName,
            files: [],
            pageCount: numPages,
            annotationsFile: null,
            pdfPages
        };

        // Add to articles list (or replace existing)
        const idx = state.articles.findIndex(a => a.name === articleName);
        if (idx >= 0) state.articles[idx] = virtualArticle;
        else state.articles.push(virtualArticle);

        if (!state.projectName) {
            state.projectName = 'PDF';
            document.getElementById('projectDisplay').innerHTML = `
                <div class="project-name">PDF files</div>`;
        }

        document.getElementById('pdfModal').classList.remove('visible');
        document.getElementById('pdfInput').value = '';
        document.getElementById('articlesSection').style.display = 'block';
        renderArticleList();
        await loadArticle(articleName);
    } catch (err) {
        progressEl.textContent = 'Error: ' + err.message;
    } finally {
        document.getElementById('processPdfBtn').disabled = false;
        _pendingPdfFile = null;
    }
}

function renderArticleList() {
    const list = document.getElementById('articleList');
    if (!state.articles.length) {
        list.innerHTML = '<div class="no-items">No articles found</div>';
        return;
    }

    list.innerHTML = state.articles.map(a => `
        <div class="article-item" data-article="${a.name}">
            <div class="article-item-name">${a.name}</div>
            <div class="article-item-meta">${a.pageCount} pages</div>
        </div>
    `).join('');

    list.querySelectorAll('.article-item').forEach(item => {
        item.onclick = () => loadArticle(item.dataset.article);
    });
}

async function loadArticle(name) {
    const article = state.articles.find(a => a.name === name);
    if (!article) return;

    // Update selection UI
    document.querySelectorAll('.article-item').forEach(el => {
        el.classList.toggle('active', el.dataset.article === name);
    });

    showLoading(true);
    state.currentArticle = name;
    state.pages = [];
    await loadArticleAnnotations(name);

    document.getElementById('articleTitle').textContent = '— ' + name;
    document.getElementById('articleEmpty').style.display = 'none';
    const scroll = document.getElementById('articleScroll');
    scroll.style.display = 'block';
    scroll.innerHTML = '';

    if (article.pdfPages) {
        // Virtual PDF article — pages are data URLs
        for (let i = 0; i < article.pdfPages.length; i++) {
            try {
                const img = await loadImageFromUrl(article.pdfPages[i]);
                const pageEl = createPage(img, i + 1);
                state.pages.push(pageEl);
                scroll.appendChild(pageEl.wrapper);
            } catch (err) {
                console.error('Error loading PDF page', i + 1, err);
            }
        }
    } else {
        for (const file of article.files) {
            try {
                const img = await loadImage(file);
                const pageNum = parseInt(file.name);
                const pageEl = createPage(img, pageNum);
                state.pages.push(pageEl);
                scroll.appendChild(pageEl.wrapper);
            } catch (err) {
                console.error('Error loading', file.name, err);
            }
        }
    }

    document.getElementById('exportBtn').disabled = false;
    document.getElementById('resetBtn').disabled = !article.annotationsFile;  // Only enable if annotations.json exists
    showLoading(false);
    renderAnnotations();
    renderFiguresPane();
}

function loadImage(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
    });
}

function loadImageFromUrl(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
    });
}

function createPage(img, pageNum) {
    const wrapper = document.createElement('div');
    wrapper.className = 'page-wrapper';

    const badge = document.createElement('div');
    badge.className = 'page-number';
    badge.textContent = pageNum;
    wrapper.appendChild(badge);

    const container = document.createElement('div');
    container.className = 'page-container';

    const imgEl = document.createElement('img');
    imgEl.src = img.src;
    container.appendChild(imgEl);

    const overlay = document.createElement('div');
    overlay.className = 'annotation-overlay';
    container.appendChild(overlay);

    wrapper.appendChild(container);
    setupDrawing(overlay, pageNum);

    return { wrapper, img: imgEl, pageNum, overlay };
}

// Drawing
function setupDrawing(overlay, pageNum) {
    let box = null;
    let start = null;

    overlay.onmousedown = (e) => {
        if (e.button !== 0) return;
        // Don't start drawing if clicking on an existing annotation or its controls
        if (e.target.closest('.annotation-box') || e.target.closest('.annotation-delete')) {
            return;
        }
        const rect = overlay.getBoundingClientRect();
        start = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        box = document.createElement('div');
        box.className = 'drawing-box';
        box.style.left = start.x + 'px';
        box.style.top = start.y + 'px';
        overlay.appendChild(box);
    };

    overlay.onmousemove = (e) => {
        if (!box) return;
        const rect = overlay.getBoundingClientRect();
        const x = Math.min(start.x, e.clientX - rect.left);
        const y = Math.min(start.y, e.clientY - rect.top);
        const w = Math.abs(e.clientX - rect.left - start.x);
        const h = Math.abs(e.clientY - rect.top - start.y);
        box.style.left = x + 'px';
        box.style.top = y + 'px';
        box.style.width = w + 'px';
        box.style.height = h + 'px';
    };

    overlay.onmouseup = (e) => {
        if (!box) return;
        const rect = overlay.getBoundingClientRect();
        const displayX = Math.min(start.x, e.clientX - rect.left);
        const displayY = Math.min(start.y, e.clientY - rect.top);
        const displayW = Math.abs(e.clientX - rect.left - start.x);
        const displayH = Math.abs(e.clientY - rect.top - start.y);

        if (displayW > 20 && displayH > 20) {
            pushHistory();
            // Convert display coordinates to natural image coordinates
            const page = state.pages.find(p => p.pageNum === pageNum);
            const scaleX = page.img.naturalWidth / rect.width;
            const scaleY = page.img.naturalHeight / rect.height;
            
            state.figures.push({
                id: 'fig' + state.nextFigureNum,
                label: 'Figure ' + state.nextFigureNum,
                pageNum,
                bounds: { 
                    x: Math.round(displayX * scaleX), 
                    y: Math.round(displayY * scaleY), 
                    width: Math.round(displayW * scaleX), 
                    height: Math.round(displayH * scaleY) 
                },
                subfigures: []
            });
            state.nextFigureNum++;
            saveAnnotations();
        }

        box.remove();
        box = null;
        start = null;
        renderAnnotations();
        renderFiguresPane();
    };

    overlay.onmouseleave = () => {
        if (box) { box.remove(); box = null; start = null; }
    };
}

// Annotations
function renderAnnotations() {
    document.querySelectorAll('#articleScroll .annotation-box').forEach(el => el.remove());

    state.figures.forEach(fig => {
        const page = state.pages.find(p => p.pageNum === fig.pageNum);
        if (!page) return;

        // Use percentage-based positioning to handle image scaling
        const imgW = page.img.naturalWidth;
        const imgH = page.img.naturalHeight;
        
        const leftPct = (fig.bounds.x / imgW * 100).toFixed(3);
        const topPct = (fig.bounds.y / imgH * 100).toFixed(3);
        const widthPct = (fig.bounds.width / imgW * 100).toFixed(3);
        const heightPct = (fig.bounds.height / imgH * 100).toFixed(3);

        const box = document.createElement('div');
        box.className = 'annotation-box';
        box.style.cssText = `left:${leftPct}%;top:${topPct}%;width:${widthPct}%;height:${heightPct}%`;

        const label = document.createElement('div');
        label.className = 'annotation-label';
        label.textContent = fig.label;
        box.appendChild(label);

        const del = document.createElement('button');
        del.className = 'annotation-delete';
        del.textContent = '×';
        del.onclick = (e) => { e.stopPropagation(); deleteFigure(fig.id); };
        box.appendChild(del);

        box.onclick = () => scrollToFigure(fig.id);
        page.overlay.appendChild(box);

        // Subfigures (positioned relative to figure bounds)
        fig.subfigures.forEach(sub => {
            const subLeftPct = ((fig.bounds.x + sub.bounds.x) / imgW * 100).toFixed(3);
            const subTopPct = ((fig.bounds.y + sub.bounds.y) / imgH * 100).toFixed(3);
            const subWidthPct = (sub.bounds.width / imgW * 100).toFixed(3);
            const subHeightPct = (sub.bounds.height / imgH * 100).toFixed(3);
            
            const subBox = document.createElement('div');
            subBox.className = 'annotation-box subfigure';
            subBox.style.cssText = `left:${subLeftPct}%;top:${subTopPct}%;width:${subWidthPct}%;height:${subHeightPct}%`;
            const subLabel = document.createElement('div');
            subLabel.className = 'annotation-label';
            subLabel.textContent = sub.label;
            subBox.appendChild(subLabel);
            page.overlay.appendChild(subBox);
        });
    });

    updateFigureCount();
}

function deleteFigure(id) {
    pushHistory();
    state.figures = state.figures.filter(f => f.id !== id);
    saveAnnotations();
    renderAnnotations();
    renderFiguresPane();
}

function scrollToFigure(id) {
    const card = document.querySelector(`[data-figure-id="${id}"]`);
    if (card) {
        // Ensure figures pane is visible
        const toggle = document.querySelector('[data-pane="figures"]');
        if (!toggle.classList.contains('active')) toggle.click();
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }
}

function updateFigureCount() {
    document.getElementById('figureCount').textContent = state.figures.length ? `(${state.figures.length})` : '';
}

// Figures pane
function renderFiguresPane() {
    const empty = document.getElementById('figuresEmpty');
    const scroll = document.getElementById('figuresScroll');

    if (!state.figures.length) {
        empty.style.display = 'flex';
        scroll.style.display = 'none';
        return;
    }

    empty.style.display = 'none';
    scroll.style.display = 'block';
    scroll.innerHTML = '';

    state.figures.forEach(fig => scroll.appendChild(createFigureCard(fig)));
}

function createFigureCard(fig) {
    const card = document.createElement('div');
    card.className = 'figure-card';
    card.dataset.figureId = fig.id;

    const header = document.createElement('div');
    header.className = 'figure-header';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'figure-label-input';
    input.value = fig.label;
    input.onchange = () => { pushHistory(); fig.label = input.value; saveAnnotations(); renderAnnotations(); };
    header.appendChild(input);

    // Page indicator
    const pageInfo = document.createElement('span');
    pageInfo.style.cssText = 'font-size:11px;color:#999;margin-left:8px;';
    pageInfo.textContent = `p.${fig.pageNum}`;
    header.appendChild(pageInfo);

    const del = document.createElement('button');
    del.className = 'btn';
    del.textContent = 'Delete';
    del.style.marginLeft = 'auto';
    del.onclick = (e) => { e.stopPropagation(); deleteFigure(fig.id); };
    header.appendChild(del);

    card.appendChild(header);

    const content = document.createElement('div');
    content.className = 'figure-content';

    const imgContainer = document.createElement('div');
    imgContainer.className = 'figure-image-container';
    imgContainer.style.cursor = 'pointer';
    imgContainer.title = 'Click to scroll to source';
    imgContainer.onclick = () => scrollToFigureSource(fig);

    const page = state.pages.find(p => p.pageNum === fig.pageNum);
    if (page) {
        const canvas = cropImage(page.img, fig.bounds);
        const img = document.createElement('img');
        img.src = canvas.toDataURL();
        imgContainer.appendChild(img);

        const overlay = document.createElement('div');
        overlay.className = 'annotation-overlay';
        imgContainer.appendChild(overlay);
        setupSubfigureDrawing(overlay, fig);
        renderSubfiguresOnCrop(overlay, fig);
    }

    content.appendChild(imgContainer);

    // Subfigures panel (only show if there are subfigures or it's a complex figure)
    const subPanel = document.createElement('div');
    subPanel.className = 'subfigures-panel';
    subPanel.innerHTML = '<h4>Subfigures</h4>';

    const subList = document.createElement('div');
    subList.className = 'subfigure-list';
    fig.subfigures.forEach(sub => subList.appendChild(createSubfigureItem(sub, fig)));
    subPanel.appendChild(subList);

    const hint = document.createElement('div');
    hint.className = 'subfigure-hint';
    hint.textContent = 'Draw on image to add';
    subPanel.appendChild(hint);

    content.appendChild(subPanel);
    card.appendChild(content);

    return card;
}

function scrollToFigureSource(fig) {
    const page = state.pages.find(p => p.pageNum === fig.pageNum);
    if (!page) return;

    // Ensure article pane is visible
    const toggle = document.querySelector('[data-pane="article"]');
    if (!toggle.classList.contains('active')) toggle.click();

    // Scroll the page wrapper into view
    setTimeout(() => {
        const articleScroll = document.getElementById('articleScroll');
        const pageWrapper = page.wrapper;
        
        // Calculate position to center the figure in view
        const imgRect = page.img.getBoundingClientRect();
        const scaleY = imgRect.height / page.img.naturalHeight;
        const figTopInPage = fig.bounds.y * scaleY;
        
        // Scroll the page into view first
        pageWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // Then adjust to show the figure
        setTimeout(() => {
            const scrollOffset = figTopInPage - 100; // 100px padding from top
            if (scrollOffset > 0) {
                articleScroll.scrollBy({ top: scrollOffset, behavior: 'smooth' });
            }
        }, 300);
    }, 100);
}

function cropImage(imgEl, bounds) {
    // bounds are already in natural image coordinates
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = bounds.width;
    canvas.height = bounds.height;
    ctx.drawImage(imgEl, bounds.x, bounds.y, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);
    return canvas;
}

function setupSubfigureDrawing(overlay, fig) {
    let box = null, start = null;

    overlay.onmousedown = (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        const rect = overlay.getBoundingClientRect();
        start = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        box = document.createElement('div');
        box.className = 'drawing-box';
        box.style.borderColor = '#f59e0b';
        box.style.left = start.x + 'px';
        box.style.top = start.y + 'px';
        overlay.appendChild(box);
    };

    overlay.onmousemove = (e) => {
        if (!box) return;
        const rect = overlay.getBoundingClientRect();
        const x = Math.min(start.x, e.clientX - rect.left);
        const y = Math.min(start.y, e.clientY - rect.top);
        const w = Math.abs(e.clientX - rect.left - start.x);
        const h = Math.abs(e.clientY - rect.top - start.y);
        box.style.left = x + 'px';
        box.style.top = y + 'px';
        box.style.width = w + 'px';
        box.style.height = h + 'px';
    };

    overlay.onmouseup = (e) => {
        if (!box) return;
        const rect = overlay.getBoundingClientRect();
        const x = Math.min(start.x, e.clientX - rect.left);
        const y = Math.min(start.y, e.clientY - rect.top);
        const w = Math.abs(e.clientX - rect.left - start.x);
        const h = Math.abs(e.clientY - rect.top - start.y);

        if (w > 15 && h > 15) {
            pushHistory();
            fig.subfigures.push({
                id: fig.id + '_s' + (fig.subfigures.length + 1),
                label: fig.label + String.fromCharCode(97 + fig.subfigures.length),
                bounds: { x, y, width: w, height: h }
            });
            saveAnnotations();
            renderFiguresPane();
            renderAnnotations();
        }

        box.remove();
        box = null;
        start = null;
    };

    overlay.onmouseleave = () => {
        if (box) { box.remove(); box = null; start = null; }
    };
}

function renderSubfiguresOnCrop(overlay, fig) {
    fig.subfigures.forEach(sub => {
        const box = document.createElement('div');
        box.className = 'annotation-box subfigure';
        box.style.cssText = `left:${sub.bounds.x}px;top:${sub.bounds.y}px;width:${sub.bounds.width}px;height:${sub.bounds.height}px`;
        const label = document.createElement('div');
        label.className = 'annotation-label';
        label.textContent = sub.label;
        box.appendChild(label);
        overlay.appendChild(box);
    });
}

function createSubfigureItem(sub, fig) {
    const item = document.createElement('div');
    item.className = 'subfigure-item';

    const page = state.pages.find(p => p.pageNum === fig.pageNum);
    if (page) {
        const figCanvas = cropImage(page.img, fig.bounds);
        const sx = figCanvas.width / fig.bounds.width;
        const sy = figCanvas.height / fig.bounds.height;
        const canvas = document.createElement('canvas');
        canvas.width = sub.bounds.width * sx;
        canvas.height = sub.bounds.height * sy;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(figCanvas, sub.bounds.x * sx, sub.bounds.y * sy, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
        const thumb = document.createElement('img');
        thumb.src = canvas.toDataURL();
        item.appendChild(thumb);
    }

    const input = document.createElement('input');
    input.type = 'text';
    input.value = sub.label;
    input.onchange = () => { pushHistory(); sub.label = input.value; saveAnnotations(); renderAnnotations(); };
    item.appendChild(input);

    const del = document.createElement('button');
    del.textContent = '×';
    del.onclick = () => {
        fig.subfigures = fig.subfigures.filter(s => s.id !== sub.id);
        saveAnnotations();
        renderFiguresPane();
        renderAnnotations();
    };
    item.appendChild(del);

    return item;
}

// Export
async function exportAll() {
    if (!state.figures.length || !state.currentArticle) return;
    showLoading(true);

    try {
        const zip = new JSZip();

        const data = {
            project: state.projectName,
            article: state.currentArticle,
            exportedAt: new Date().toISOString(),
            figures: state.figures.map(f => ({
                id: f.id, label: f.label, page: f.pageNum, bounds: f.bounds,
                subfigures: f.subfigures.map(s => ({ id: s.id, label: s.label, bounds: s.bounds }))
            }))
        };
        zip.file('annotations.json', JSON.stringify(data, null, 2));

        for (const fig of state.figures) {
            const page = state.pages.find(p => p.pageNum === fig.pageNum);
            if (!page) continue;
            const canvas = cropImage(page.img, fig.bounds);
            const figBlob = await canvasToBlob(canvas);
            zip.file(sanitize(fig.label) + '.png', figBlob);

            for (const sub of fig.subfigures) {
                const sx = canvas.width / fig.bounds.width;
                const sy = canvas.height / fig.bounds.height;
                const subCanvas = document.createElement('canvas');
                subCanvas.width = sub.bounds.width * sx;
                subCanvas.height = sub.bounds.height * sy;
                subCanvas.getContext('2d').drawImage(canvas, sub.bounds.x * sx, sub.bounds.y * sy, subCanvas.width, subCanvas.height, 0, 0, subCanvas.width, subCanvas.height);
                const subBlob = await canvasToBlob(subCanvas);
                zip.file(sanitize(sub.label) + '.png', subBlob);
            }
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = `${state.currentArticle}_figures.zip`;
        a.click();
    } finally {
        showLoading(false);
    }
}

function canvasToBlob(canvas) {
    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function download(content, name, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type }));
    a.download = name;
    a.click();
}

function downloadCanvas(canvas, name) {
    return new Promise(r => {
        canvas.toBlob(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            setTimeout(r, 50);
        }, 'image/png');
    });
}

function sanitize(s) { return s.replace(/[^a-zA-Z0-9_-]/g, '_'); }

// Storage
function saveAnnotations() {
    if (!state.currentArticle) return;
    localStorage.setItem('figext_' + state.currentArticle, JSON.stringify({
        figures: state.figures,
        nextFigureNum: state.nextFigureNum
    }));
}

async function loadArticleAnnotations(name) {
    state.figures = [];
    state.nextFigureNum = 1;
    
    // First, try to load from annotations.json file (Docling output)
    const article = state.articles.find(a => a.name === name);
    if (article && article.annotationsFile) {
        try {
            const text = await article.annotationsFile.text();
            const data = JSON.parse(text);
            if (data.figures && data.figures.length) {
                console.log(`Loaded ${data.figures.length} figures from annotations.json`);
                // Convert from Docling format to our format
                state.figures = data.figures.map((f, idx) => ({
                    id: f.id || ('fig' + (idx + 1)),
                    label: f.label || ('Figure ' + (idx + 1)),
                    pageNum: f.pageNum,
                    bounds: f.bounds,
                    subfigures: f.subfigures || []
                }));
                state.nextFigureNum = state.figures.length + 1;
            }
        } catch (e) {
            console.warn('Error loading annotations.json:', e);
        }
    }
    
    // Then, check localStorage for any manual overrides/edits
    try {
        const data = JSON.parse(localStorage.getItem('figext_' + name));
        if (data && data.figures && data.figures.length) {
            // localStorage takes precedence if it has data
            state.figures = data.figures;
            state.nextFigureNum = data.nextFigureNum || state.figures.length + 1;
            console.log(`Loaded ${state.figures.length} figures from localStorage (overrides annotations.json)`);
        }
    } catch (e) {}
}

function showLoading(show) {
    document.getElementById('loading').classList.toggle('visible', show);
}

async function resetToDocling() {
    if (!state.currentArticle) return;
    
    const article = state.articles.find(a => a.name === state.currentArticle);
    if (!article || !article.annotationsFile) {
        alert('No annotations.json file found for this article.');
        return;
    }
    
    // Clear localStorage
    localStorage.removeItem('figext_' + state.currentArticle);
    
    // Reload from annotations.json
    state.figures = [];
    state.nextFigureNum = 1;
    try {
        const text = await article.annotationsFile.text();
        const data = JSON.parse(text);
        if (data.figures && data.figures.length) {
            state.figures = data.figures.map((f, idx) => ({
                id: f.id || ('fig' + (idx + 1)),
                label: f.label || ('Figure ' + (idx + 1)),
                pageNum: f.pageNum,
                bounds: f.bounds,
                subfigures: f.subfigures || []
            }));
            state.nextFigureNum = state.figures.length + 1;
        }
    } catch (e) {
        console.error('Error loading annotations.json:', e);
    }
    
    renderAnnotations();
    renderFiguresPane();
}

// ========== AI API ==========
// Programmatic interface for AI agents and automation
window.figureExtractor = {
    // Get current state
    getState: () => ({
        projectName: state.projectName,
        currentArticle: state.currentArticle,
        articles: state.articles.map(a => ({ name: a.name, pageCount: a.pageCount })),
        figures: state.figures,
        pageCount: state.pages.length
    }),

    // List available articles (after project is loaded)
    listArticles: () => state.articles.map(a => ({ name: a.name, pageCount: a.pageCount })),

    // Load an article by name (project must be loaded first via UI or loadProjectFromPath)
    loadArticle: async (articleName) => {
        const article = state.articles.find(a => a.name === articleName);
        if (!article) throw new Error(`Article not found: ${articleName}`);
        await loadArticle(articleName);
        return { success: true, pages: state.pages.length, article: articleName };
    },

    // Add a figure annotation
    // bounds: {x, y, width, height} in display pixels (relative to rendered image)
    addFigure: (pageNum, bounds, label = null) => {
        const page = state.pages.find(p => p.pageNum === pageNum);
        if (!page) throw new Error(`Page ${pageNum} not found`);

        const fig = {
            id: 'fig' + state.nextFigureNum,
            label: label || 'Figure ' + state.nextFigureNum,
            pageNum,
            bounds: { x: bounds.x, y: bounds.y, width: bounds.width, height: bounds.height },
            subfigures: []
        };
        state.figures.push(fig);
        state.nextFigureNum++;
        saveAnnotations();
        renderAnnotations();
        renderFiguresPane();
        return { success: true, figureId: fig.id, label: fig.label };
    },

    // Add a subfigure to an existing figure
    // bounds are relative to the figure's cropped image
    addSubfigure: (figureId, bounds, label = null) => {
        const fig = state.figures.find(f => f.id === figureId);
        if (!fig) throw new Error(`Figure not found: ${figureId}`);

        const sub = {
            id: fig.id + '_s' + (fig.subfigures.length + 1),
            label: label || fig.label + String.fromCharCode(97 + fig.subfigures.length),
            bounds: { x: bounds.x, y: bounds.y, width: bounds.width, height: bounds.height }
        };
        fig.subfigures.push(sub);
        saveAnnotations();
        renderAnnotations();
        renderFiguresPane();
        return { success: true, subfigureId: sub.id, label: sub.label };
    },

    // Update figure label
    updateFigureLabel: (figureId, newLabel) => {
        const fig = state.figures.find(f => f.id === figureId);
        if (!fig) throw new Error(`Figure not found: ${figureId}`);
        fig.label = newLabel;
        saveAnnotations();
        renderAnnotations();
        renderFiguresPane();
        return { success: true };
    },

    // Delete a figure
    deleteFigure: (figureId) => {
        const idx = state.figures.findIndex(f => f.id === figureId);
        if (idx === -1) throw new Error(`Figure not found: ${figureId}`);
        state.figures.splice(idx, 1);
        saveAnnotations();
        renderAnnotations();
        renderFiguresPane();
        return { success: true };
    },

    // Get a page as base64 PNG (for vision model analysis)
    getPageAsBase64: (pageNum) => {
        const page = state.pages.find(p => p.pageNum === pageNum);
        if (!page) throw new Error(`Page ${pageNum} not found`);
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = page.img.naturalWidth;
        canvas.height = page.img.naturalHeight;
        ctx.drawImage(page.img, 0, 0);
        return canvas.toDataURL('image/png');
    },

    // Get figure crop as base64 PNG
    getFigureAsBase64: (figureId) => {
        const fig = state.figures.find(f => f.id === figureId);
        if (!fig) throw new Error(`Figure not found: ${figureId}`);
        
        const page = state.pages.find(p => p.pageNum === fig.pageNum);
        if (!page) throw new Error(`Page ${fig.pageNum} not found`);
        
        const canvas = cropImage(page.img, fig.bounds);
        return canvas.toDataURL('image/png');
    },

    // Get page dimensions (for calculating annotation coordinates)
    getPageDimensions: (pageNum) => {
        const page = state.pages.find(p => p.pageNum === pageNum);
        if (!page) throw new Error(`Page ${pageNum} not found`);
        
        const rect = page.img.getBoundingClientRect();
        return {
            displayWidth: rect.width,
            displayHeight: rect.height,
            naturalWidth: page.img.naturalWidth,
            naturalHeight: page.img.naturalHeight,
            scale: page.img.naturalWidth / rect.width
        };
    },

    // Export all figures and annotations (triggers downloads)
    export: async () => {
        await exportAll();
        return { success: true, figureCount: state.figures.length };
    },

    // Get annotations as JSON (without triggering download)
    getAnnotationsJSON: () => ({
        project: state.projectName,
        article: state.currentArticle,
        exportedAt: new Date().toISOString(),
        figures: state.figures.map(f => ({
            id: f.id, label: f.label, page: f.pageNum, bounds: f.bounds,
            subfigures: f.subfigures.map(s => ({ id: s.id, label: s.label, bounds: s.bounds }))
        }))
    }),

    // Clear all annotations for current article
    clearAnnotations: () => {
        state.figures = [];
        state.nextFigureNum = 1;
        saveAnnotations();
        renderAnnotations();
        renderFiguresPane();
        return { success: true };
    },

    // Check if ready (project and article loaded)
    isReady: () => ({
        projectLoaded: !!state.projectName,
        articleLoaded: !!state.currentArticle && state.pages.length > 0,
        projectName: state.projectName,
        articleName: state.currentArticle,
        pageCount: state.pages.length,
        figureCount: state.figures.length
    })
};

// Log API availability
console.log('Figure Extractor API available at window.figureExtractor');
console.log('Methods: getState, listArticles, loadArticle, addFigure, addSubfigure, getPageAsBase64, export, etc.');
</script>
